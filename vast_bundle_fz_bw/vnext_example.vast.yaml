paths:
  data_root: vast_bundle_fz_bw/data_root
  out_root: data/vnext_gt_real_out
model:
  type: fz
  target_grf_column: Fz_BW
  per_sensor_hidden: 32
  fusion_hidden: 64
features:
  enable_kinematics: true
data:
  train_manifest: manifests/train_manifest.bundled.csv
  val_manifest: manifests/val_manifest.bundled.csv
training:
  batch_size: 8
  num_workers: 0
  window_size: 256
  window_stride: 128
  epochs: 5
  lr: 1e-3
  target_norm: zscore
  lr_scheduler: cosine
  grad_clip_norm: 1.0
  require_grf: true
