paths:
  data_root: data/vnext_gt_real
  out_root: data/vnext_gt_real_out
model:
  type: fz
  target_grf_column: Fz_BW
  per_sensor_hidden: 64
  fusion_hidden: 128
  grf_axes: fz
features:
  enable_kinematics: true
data:
  train_manifest: manifests/vnext_train_real.csv
  val_manifest: manifests/vnext_val_real.csv
training:
  batch_size: 8
  num_workers: 0
  window_size: 128
  window_stride: 64
  epochs: 1
  lr: 1e-3
  require_grf: true
