paths:
  data_root: data/vnext_gt_real
  out_root: data/vnext_gt_real_out
model:
  type: fz
  per_sensor_hidden: 32
  fusion_hidden: 64
features:
  enable_kinematics: false
data:
  train_manifest: manifests/vnext_train_real.csv
  val_manifest: manifests/vnext_val_real.csv
training:
  batch_size: 2
  num_workers: 0
  window_size: 64
  window_stride: 32
  epochs: 1
  lr: 1e-3
  require_grf: true
