# configs/models.yaml

ridge:
  enabled: true
  param_grid:
    alpha: [0.1, 1.0, 10.0, 100.0]
  random_state: 42

rf:
  enabled: true
  param_grid:
    n_estimators: [400, 800, 1200]
    max_depth: [null, 20, 30]
    min_samples_leaf: [1, 2, 4]
    max_features: ["sqrt", 0.5]
  random_state: 42

hgb:
  enabled: true
  param_grid:
    max_iter: [300, 600, 1000]
    learning_rate: [0.03, 0.05, 0.1]
    max_leaf_nodes: [31, 63, 127]
    max_depth: [null, 8, 12]
    min_samples_leaf: [20, 50, 100]
    l2_regularization: [0.0, 0.1, 1.0]
  random_state: 42

xgb:
  enabled: false  # requires xgboost
  n_estimators: 600
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  n_jobs: -1
  random_state: 42

stack:
  enabled: false
  ridge_alpha: 1.0
  rf_n_estimators: 300
  rf_max_depth: null
  hgb_max_iter: 300
  hgb_learning_rate: 0.05
  final_alpha: 1.0
  n_jobs: -1

cnn1d:
  enabled: false  # requires torch
  input_channels: 6
  seq_len: 100
  hidden: 16
  lr: 0.001
  epochs: 10
  batch_size: 64
