# GT small real-data vNext sweep (long training) using Georgia Tech ProcessedData

base_config: "configs/vnext_example.yaml"

experiments:
  - name: "gt_small_fz_raw_n"
    tags: ["gt_small", "fz", "raw", "cpu", "N", "long"]
    overrides:
      paths:
        data_root: "data/vnext_gt_real"
        out_root: "data/vnext_gt_real_out"
      features:
        enable_kinematics: false
      data:
        train_manifest: "manifests/vnext_train_real.csv"
        val_manifest:   "manifests/vnext_val_real.csv"
      training:
        batch_size: 32
        num_workers: 0
        window_size: 128
        window_stride: 32
        epochs: 20
        lr: 1e-3

  - name: "gt_small_fz_raw_bw"
    tags: ["gt_small", "fz", "raw", "cpu", "bw", "long"]
    overrides:
      paths:
        data_root: "data/vnext_gt_real"
        out_root: "data/vnext_gt_real_out"
      features:
        enable_kinematics: false
      model:
        target_grf_column: "Fz_BW"
      data:
        train_manifest: "manifests/vnext_train_real.csv"
        val_manifest:   "manifests/vnext_val_real.csv"
      training:
        batch_size: 32
        num_workers: 0
        window_size: 128
        window_stride: 32
        epochs: 20
        lr: 1e-3

  - name: "gt_small_fz_kinematics_bw"
    tags: ["gt_small", "fz", "kinematics", "cpu", "bw", "long"]
    overrides:
      paths:
        data_root: "data/vnext_gt_real"
        out_root: "data/vnext_gt_real_out"
      model:
        target_grf_column: "Fz_BW"
      data:
        train_manifest: "manifests/vnext_train_real.csv"
        val_manifest:   "manifests/vnext_val_real.csv"
      training:
        batch_size: 32
        num_workers: 0
        window_size: 128
        window_stride: 32
        epochs: 20
        lr: 1e-3
