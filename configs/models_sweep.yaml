# configs/models_sweep.yaml
# Reduced grids for quick sweep at 300 ms, dual sensors only
ridge:
  enabled: false

rf:
  enabled: true
  param_grid:
    n_estimators: [800, 1200]
    max_depth: [null, 20]
    min_samples_leaf: [1, 2]
    max_features: ["sqrt"]
  random_state: 42

hgb:
  enabled: true
  param_grid:
    max_iter: [600, 1000]
    learning_rate: [0.05, 0.1]
    max_leaf_nodes: [63]
    max_depth: [null, 8]
    min_samples_leaf: [50]
    l2_regularization: [0.1]
  random_state: 42
